apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-tracing
  namespace: agentic-harnesses
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: my-mlflow-integration
  namespace: agentic-harnesses
rules:
- apiGroups: [mlflow.kubeflow.org]
  resources: [experiments, datasets, registeredmodels]
  verbs: [get, list, create, update, patch]
---
# RoleBinding to grant the backend service account MLflow integration permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: my-mlflow-integration-binding
  namespace: agentic-harnesses
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: my-mlflow-integration
subjects:
- kind: ServiceAccount
  name: mlflow-tracing
  namespace: agentic-harnesses
---
apiVersion: v1
kind: Secret
metadata:
  name: long-lived-otel-api-token
  namespace: agentic-harnesses
  annotations:
    kubernetes.io/service-account.name: mlflow-tracing
    description: "Long-lived token for tracing my agentic harnesses"
type: kubernetes.io/service-account-token
