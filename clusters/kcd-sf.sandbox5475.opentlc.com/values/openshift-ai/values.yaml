---
channel: fast-3.x

dataScienceCluster:
  version: v2
  components:
    dashboard:
      managementState: Managed
    feastoperator:
      managementState: Managed
    kserve:
      nim:
        managementState: Removed
      rawDeploymentServiceConfig: Headless
      managementState: Managed
    kueue:
      defaultClusterQueueName: default
      defaultLocalQueueName: default
      managementState: Removed
    llamastackoperator:
      managementState: Managed
    mlflowoperator:
      managementState: Managed
    modelregistry:
      registriesNamespace: rhoai-model-registries
      managementState: Managed
    ray:
      managementState: Managed
    trainingoperator:
      managementState: Managed
    trustyai:
      eval:
        lmeval:
          permitCodeExecution: allow
          permitOnline: allow
      managementState: Managed
    workbenches:
      workbenchNamespace: rhods-notebooks
      managementState: Managed
    aipipelines:
      argoWorkflowsControllers:
        managementState: Managed
      managementState: Managed

dataScienceClusterInitialization: null
dashboardConfig:
  disableLMEval: false
  genAiStudio: true
  modelAsService: true

modelServerSizes: null
notebookSizes: null

hardwareProfiles:
  nvidia-l40s-gpu:
    displayName: NVIDIA L40S GPU
    cpu:
      min: 1
      default: 4
      max: 8
    memory:
      min: 2Gi
      default: 8Gi
      max: 32Gi
    gpu:
      nvidia.com/gpu:
        displayName: NVIDIA L40S GPU
        min: 1
        default: 1
        max: 1
    node:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
